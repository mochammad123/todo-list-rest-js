services:
  postgres:
    image: postgres:16-alpine
    container_name: todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_db
    ports:
      - 5434:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
    container_name: todo-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: todo_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-change_me_minimum_32_characters_long}
      JWT_EXPIRES_IN: 7d
    ports:
      - 3000:3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../todo-list-react
    container_name: todo-frontend
    restart: unless-stopped
    environment:
      VITE_APP_NAME: todo-list-react
      VITE_BASE_API_URL: ${VITE_BASE_API_URL:-http://localhost:3000/api}
      VITE_ENVIRONTMENT: PRODUCTION
    ports:
      - 5173:5173
    depends_on:
      - backend

volumes:
  postgres_data:
